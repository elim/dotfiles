# Agent guard key bindings.
#
# These bindings are always loaded at tmux startup. Whether they engage depends
# on @agent_guard_pane (a session option): when it matches the active pane the
# guard is on; when it is unset every binding falls through to normal behaviour.
# The option is managed at runtime by agent_tmux_guard_activate/deactivate in
# agent-wrappers.zsh.
#
# C-c prefix (Emacs-style):
#   C-c c / C-c C-c  →  send C-c to the agent (cancel / back in submenu)
#   C-c l / C-c C-l  →  send C-l to the agent (clear screen)
#   C-c g / C-c C-g  →  send C-g to the agent (open external editor directly)
#   C-c Esc          →  abort silently

bind -n C-b if-shell -F '#{==:#{pane_id},#{@agent_guard_pane}}' { send-keys Left } { send-keys C-b }
bind -n M-g if-shell -F '#{==:#{pane_id},#{@agent_guard_pane}}' { send-keys C-g } { send-keys M-g }
bind -n C-c if-shell -F '#{==:#{pane_id},#{@agent_guard_pane}}' { display-message 'C-c — [c]cancel [l]clear [g]editor  Esc=back' ; switch-client -T agent-passthrough-cc } { send-keys C-c }
bind -n C-g if-shell -F '#{==:#{pane_id},#{@agent_guard_pane}}' { display-message 'C-g blocked; use C-c C-g to pass through' } { send-keys C-g }
bind -n C-l if-shell -F '#{==:#{pane_id},#{@agent_guard_pane}}' { display-message 'C-l blocked; use C-c C-l to pass through' } { send-keys C-l }

bind -T agent-passthrough-cc c      send-keys C-c
bind -T agent-passthrough-cc C-c    send-keys C-c
bind -T agent-passthrough-cc g      send-keys C-g
bind -T agent-passthrough-cc C-g    send-keys C-g
bind -T agent-passthrough-cc l      send-keys C-l
bind -T agent-passthrough-cc C-l    send-keys C-l
bind -T agent-passthrough-cc Escape display-message ''
