# prefix
set -g prefix C-z
bind C-z send-prefix
unbind C-b

# Update WezTerm environment variables when attaching to existing sessions
# This ensures that `wezterm cli` commands work properly from within tmux
set-option -ga update-environment "WEZTERM_UNIX_SOCKET"
set-option -ga update-environment "WEZTERM_PANE"

# preserve current path
bind '"' split-window -vc "#{pane_current_path}"
bind '%' split-window -hc "#{pane_current_path}"
bind 'c' new-window   -c  "#{pane_current_path}"

bind '-' split-window -vc "#{pane_current_path}"
bind '|' split-window -hc "#{pane_current_path}"

# status
set -g status-interval 10
set -g status-style fg=white,bg=colour240
set -g window-status-current-style fg=colour240,bg=white
set -g status-left "#[fg=colour110,bg=colour241]#S #[default]"
set -g status-left-length 25

# automatic rename & topic naming
set -g automatic-rename on
set -g automatic-rename-format '#{?@topic,[#{@topic}],#{b:pane_current_path}}:#{pane_current_command}'
bind T command-prompt -p "Topic name:" "set-option -w @topic '%%'"

# pane-border & active pane badge (Nord theme)
set -g pane-border-status bottom
set -g pane-border-lines heavy
set -g pane-border-indicators off
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#88C0D0"
set -g pane-border-format '#{?pane_active,#[bold#,fg=#2E3440#,bg=#88C0D0] ▶ #{pane_index}:#{pane_current_command} #[default],#[fg=#D8DEE9#,bg=#434C5E]  #{pane_index}:#{pane_current_command} #[default]}'

# mouse
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# key-bindings
bind C-r source-file ~/.tmux.conf
bind C-k confirm-before -p "kill-pane #{pane_index} ? (y/n)" kill-pane
bind k   confirm-before -p "kill-pane #{pane_index} ? (y/n)" kill-pane
bind r respawn-pane

unbind &

set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection -x

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H swap-pane -t '{left-of}'
bind J swap-pane -t '{down-of}'
bind K swap-pane -t '{up-of}'
bind L swap-pane -t '{right-of}'

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256color:extkeys,wezterm:extkeys"
set -s extended-keys always
set -g extended-keys-format csi-u

# history
set-option -g history-limit 20000

# copy-mode ^[
unbind ^"["
bind -r ^"[" copy-mode
unbind ^]
bind -r ^] paste-buffer

set -g escape-time 0

set -g set-titles on

# reattach-to-user-namespace
# Based upon http://moznion.hatenadiary.com/entry/2014/08/20/165328
if-shell 'test "$(uname -s)" = Darwin > /dev/null 2>&1' 'source-file ~/.tmux.d/macos.conf'
if-shell 'test "$(uname -s)" = Linux  > /dev/null 2>&1' 'source-file ~/.tmux.d/linux.conf'
